name: Tester build

# Builds the tester version of the extension (QA logging on) and publishes
# it as a zip on a GitHub Release called "Tester build (latest)", so
# testers can download and load it without cloning or building anything.
# Runs on every push to main, or by hand from the Actions tab.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Never cancel a run mid-publish: queue the next one instead.
concurrency:
  group: tester-build
  cancel-in-progress: false

jobs:
  tester-zip:
    name: Build and publish tester zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build

      - name: Check this is a tester build with the pinned extension ID
        run: |
          grep -q '"key"' dist/manifest.json || { echo "dist/manifest.json has no key -- sign-in would break"; exit 1; }
          grep -lq '/api/qa-events' dist/assets/*.js || { echo "QA logging missing from the tester build"; exit 1; }

      - name: Zip dist/ inside a folder testers can keep
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          mkdir -p staging
          cp -r dist staging/aire-extension-tester
          (cd staging && zip -qr ../aire-extension-tester.zip aire-extension-tester)

      - uses: actions/upload-artifact@v4
        with:
          name: aire-extension-tester-${{ env.SHORT_SHA }}
          path: aire-extension-tester.zip
          retention-days: 30

      - name: Publish to the "tester-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Tester build from commit ${SHORT_SHA} ($(date -u '+%d %b %Y %H:%M UTC')).

          To install: download aire-extension-tester.zip, unzip it somewhere you'll keep it, open chrome://extensions, turn on Developer mode, click Load unpacked and choose the aire-extension-tester folder.

          To update: replace that folder with the new one, then click the reload icon on the extension's card.

          This build sends error reports and feature usage (never prompt text or conversations) to the AIRE team while you're signed in. Report problems from Settings > Send feedback or report a problem."
          # Update in place rather than delete-and-recreate, so the download
          # link in the README never goes missing while a new build publishes.
          git tag -f tester-latest "$GITHUB_SHA"
          git push -f origin refs/tags/tester-latest
          if gh release view tester-latest >/dev/null 2>&1; then
            gh release upload tester-latest aire-extension-tester.zip --clobber
            gh release edit tester-latest --title "Tester build (latest)" --notes "$NOTES" --prerelease
          else
            gh release create tester-latest aire-extension-tester.zip \
              --title "Tester build (latest)" \
              --notes "$NOTES" \
              --prerelease
          fi

      # Keeps a ready-to-load copy of the tester build in the repository's
      # extension/ folder, so "Code > Download ZIP" on GitHub gives people a
      # folder Chrome can load directly. Pushes made with the workflow's own
      # token don't start new workflow runs, so this can't loop.
      - name: Update the extension/ folder in the repository
        run: |
          rm -rf extension
          cp -r dist extension
          cp .github/extension-folder-README.md extension/README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A extension
          if git diff --cached --quiet; then
            echo "extension/ is already up to date"
            exit 0
          fi
          git commit -q -m "chore: update the ready-to-load extension/ folder (${SHORT_SHA}) [skip ci]"
          # Someone may have pushed meanwhile; their own run builds a newer
          # copy, so on a conflict just leave it to that run.
          for attempt in 1 2 3; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "::warning::Could not update extension/ (main moved); the next push will."
