name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  extension:
    name: Extension (typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      # Testers load the committed extension/ folder. If its manifest no
      # longer matches a fresh build (new sites, permissions, version),
      # someone forgot `pnpm run build:extension`.
      - name: extension/ folder is up to date
        run: |
          node -e "
            const pick = (m) => JSON.stringify({ v: m.version, d: m.description, p: m.permissions, h: m.host_permissions, c: m.content_scripts.map((s) => s.matches) })
            const built = pick(require('./dist/manifest.json')), committed = pick(require('./extension/manifest.json'))
            if (built !== committed) { console.error('extension/ is out of date: run pnpm run build:extension and commit it'); process.exit(1) }
          "

  e2e:
    name: E2E (real extension, real Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck:e2e
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      # Chrome extensions need a headed browser (no supported headless
      # mode for MV3 extensions); Xvfb gives it a display to run against
      # on a GUI-less runner.
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: xvfb-run --auto-servernum -- pnpm exec playwright test

  backend:
    name: Backend (typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
